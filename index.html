<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>COPPER & GEAR WORKSTATION</title>
    <style>
        body {
            background-color: #1a120b;
            /* Gear & Grid Pattern */
            background-image: 
                radial-gradient(circle at 50% 50%, #2c1e12 8%, transparent 8.5%),
                linear-gradient(45deg, #24190e 25%, transparent 25%, transparent 75%, #24190e 75%, #24190e),
                linear-gradient(to right, #24190e 1px, transparent 1px),
                linear-gradient(to bottom, #24190e 1px, transparent 1px);
            background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
            color: #d48841;
            font-family: 'Courier New', monospace;
            display: flex; flex-direction: column; align-items: center;
            margin: 0; padding: 20px;
        }

        #workstation {
            width: 90%; max-width: 1000px;
            border: 8px solid #3e2723;
            background: rgba(15, 10, 5, 0.95);
            box-shadow: 0 0 30px #000, inset 0 0 60px #2c1e12;
            padding: 30px; border-radius: 10px;
        }

        header { 
            text-align: center; 
            font-size: 24px; 
            letter-spacing: 4px;
            border-bottom: 3px double #d48841; 
            padding-bottom: 15px; 
            margin-bottom: 20px;
            text-shadow: 2px 2px #000;
        }

        textarea {
            width: 100%; height: 350px;
            background: #050505; color: #ffab40;
            border: 2px solid #5d4037; padding: 15px;
            font-size: 16px; resize: none; box-sizing: border-box;
            box-shadow: inset 0 0 10px #000;
        }

        .controls { display: flex; gap: 10px; margin-top: 15px; }

        button {
            flex: 1; background: #d48841; color: #1a120b; 
            border: 2px solid #3e2723; padding: 12px;
            font-weight: bold; cursor: pointer; font-size: 16px;
        }

        button:hover { background: #ffab40; color: #000; }

        #console {
            margin-top: 20px; height: 200px; overflow-y: auto;
            background: #000; border: 2px inset #5d4037;
            padding: 15px; color: #a5d6a7; font-size: 14px;
            box-shadow: inset 0 0 20px #000;
        }
    </style>
</head>
<body>

<div id="workstation">
    <header>⚙️ COPPER & GEAR v1.7 ⚡</header>
    <textarea id="editor" spellcheck="false">
// Define a Gear (Function)
Gear Amplify(val) {
    Wire RAM result = val * 2;
    Volt "Amplify Gear Engaged";
    return result;
};

// Setup Wires
Wire RAM current = 50;
Wire CPU label = "Current Level:";

// Execute
Volt label;
Volt current;

// Trip the Breaker
Breaker (current > 40) {
    Volt "WARNING: HIGH VOLTAGE";
};</textarea>

    <div class="controls">
        <button onclick="ignite()">IGNITE PULSE (RUN)</button>
        <button onclick="clearConsole()">PURGE SYSTEM (CLEAR)</button>
    </div>

    <div id="console"></div>
</div>

<script>
    let hardware = { wires: {} };

    function log(msg, type = "info") {
        const con = document.getElementById('console');
        let color = "#a5d6a7"; // Normal Volt
        if (type === "error") color = "#ff5252"; // Short Circuit
        if (type === "system") color = "#ffab40"; // Wiring info
        
        con.innerHTML += `<span style="color:${color}">[${new Date().toLocaleTimeString()}] ${msg}</span><br>`;
        con.scrollTop = con.scrollHeight;
    }

    function clearConsole() { document.getElementById('console').innerHTML = ""; }

    function ignite() {
        const code = document.getElementById('editor').value;
        const lines = code.split(';');
        
        lines.forEach(line => {
            let cmd = line.trim();
            if (!cmd || cmd.startsWith("//")) return;

            try {
                // 1. VOLT COMMAND
                if (cmd.startsWith('Volt ')) {
                    let target = cmd.replace('Volt ', '').replace(/"/g, '').trim();
                    let val = hardware.wires[target] !== undefined ? hardware.wires[target] : target;
                    log(`VOLTAGE: ${val}`);
                }

                // 2. WIRE ASSIGNMENT (Wire RAM x = 10)
                else if (cmd.startsWith('Wire ')) {
                    let match = cmd.match(/Wire (RAM|ROM|CPU) (\w+) = (.*)/);
                    if (match) {
                        let [_, type, name, value] = match;
                        
                        // Strict Hardware Check
                        if (type === "RAM" && isNaN(parseInt(value))) {
                            throw `Short Circuit! CPU data cannot power RAM wire '${name}'`;
                        }
                        
                        hardware.wires[name] = type === "CPU" ? value.replace(/"/g, '') : eval(value);
                        log(`Wire '${name}' energized (${type}).`, "system");
                    }
                }

                // 3. BREAKER (Simple logic)
                else if (cmd.startsWith('Breaker')) {
                    let condition = cmd.match(/\((.*)\)/)[1];
                    // Replace wire names with values for eval
                    for (let w in hardware.wires) {
                        condition = condition.replace(new RegExp(w, 'g'), hardware.wires[w]);
                    }
                    if (eval(condition)) {
                        log("Breaker closed. Current passing...", "system");
                    } else {
                        log("Breaker tripped. Block skipped.", "system");
                    }
                }

                // 4. GEAR (Registration)
                else if (cmd.startsWith('Gear ')) {
                    let gearName = cmd.match(/Gear (\w+)/)[1];
                    log(`⚙️ Gear '${gearName}' mounted to the chassis.`, "system");
                }

            } catch (e) {
                log(`💥 ERROR: ${e}`, "error");
            }
        });
    }
</script>

</body>
</html>
