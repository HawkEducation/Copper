<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>COPPER v3.6</title>
    <style>
        body { background: #1a120b; color: #d48841; font-family: monospace; padding: 20px; }
        #main-grid { display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
        #workstation { border: 2px solid #3e2723; padding: 15px; background: #000; }
        #hardware-rack { border: 2px solid #3e2723; padding: 15px; background: #050505; height: 500px; overflow-y: auto; }
        textarea { width: 100%; height: 200px; background: #000; color: #ffab40; border: 1px solid #3e2723; padding: 10px; }
        #console { height: 150px; overflow-y: auto; background: #000; color: #a5d6a7; border: 1px inset #3e2723; margin-top: 10px; padding: 10px; }
        .unit { border-left: 3px solid #d48841; padding: 5px; margin-bottom: 10px; background: #111; }
        #input-overlay { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #000; border: 2px solid #d48841; padding: 20px; z-index: 1000; }
    </style>
</head>
<body>

<div id="input-overlay">
    <div>REGULATOR INPUT:</div>
    <input type="text" id="manual-in" style="background:#000; color:#00ff41; border:1px solid #d48841; padding:5px; margin-top:10px;">
</div>

<div id="main-grid">
    <div id="workstation">
        <div style="margin-bottom:10px;">PSI: <span id="psi">0</span></div>
        <textarea id="editor" spellcheck="false">
Wire RAM volts = Regulator;

Pulse 3 {
    Volt volts;
}

Flow;</textarea>
        <button onclick="ignite()" style="width:100%; padding:10px; background:#d48841; color:#000; border:none; cursor:pointer; font-weight:bold;">IGNITE</button>
        <div id="console"></div>
    </div>
    <div id="hardware-rack"></div>
</div>

<script>
    let hardware = { wires: {}, pressure: 0 };
    
    function execute(cmd) {
        if (!cmd) return;
        const con = document.getElementById('console');
        if (cmd.startsWith('Volt ')) {
            let target = cmd.replace('Volt ', '').replace(/"/g, '').trim();
            // Output raw value only
            con.innerHTML += `${hardware.wires[target] !== undefined ? hardware.wires[target] : target}<br>`;
        } else if (cmd === 'Flow') {
            hardware.pressure = 0;
        }
    }

    async function ignite() {
        const code = document.getElementById('editor').value;
        const lines = code.split(';');
        const con = document.getElementById('console');
        con.innerHTML = "";
        hardware.wires = {};

        for (let i = 0; i < lines.length; i++) {
            let cmd = lines[i].trim();
            if (!cmd) continue;

            if (cmd.includes('= Regulator')) {
                const overlay = document.getElementById('input-overlay');
                const field = document.getElementById('manual-in');
                overlay.style.display = 'block'; field.focus();
                let val = await new Promise(r => {
                    field.onkeydown = (e) => { if(e.key==='Enter') { overlay.style.display='none'; r(field.value); field.value=''; }};
                });
                hardware.wires[cmd.split(' ')[2]] = val;
            } 
            else if (cmd.startsWith('Pulse')) {
                let countMatch = cmd.match(/Pulse (\d+)/);
                let bodyMatch = cmd.match(/\{([\s\S]*)\}/);
                if (countMatch && bodyMatch) {
                    let count = parseInt(countMatch[1]);
                    let loopBody = bodyMatch[1].split(';');
                    for(let c=0; c<count; c++) {
                        for(let lcmd of loopBody) execute(lcmd.trim());
                    }
                }
            }
            else { execute(cmd); }
            render();
        }
    }

    function render() {
        const rack = document.getElementById('hardware-rack');
        rack.innerHTML = "";
        for (let w in hardware.wires) {
            rack.innerHTML += `<div class="unit"><b>${w}:</b> ${hardware.wires[w]}</div>`;
        }
        document.getElementById('psi').innerText = hardware.pressure;
    }
</script>
</body>
</html>
