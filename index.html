<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>THE CLANK OF COPPER</title>
    <style>
        body { background: #1a120b; color: #d48841; font-family: monospace; padding: 20px; }
        #main-grid { display: grid; grid-template-columns: 1fr 300px; gap: 20px; max-width: 1000px; margin: auto; }
        #workstation { border: 2px solid #3e2723; padding: 15px; background: #000; }
        textarea { width: 100%; height: 180px; background: #000; color: #ffab40; border: 1px solid #3e2723; padding: 10px; outline: none; }
        #console { height: 250px; overflow-y: auto; background: #000; color: #a5d6a7; border: 1px inset #3e2723; margin-top: 10px; padding: 10px; }
        #input-overlay { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #000; border: 2px solid #d48841; padding: 20px; z-index: 1000; }
        button { width: 100%; padding: 10px; background: #d48841; border: none; cursor: pointer; font-weight: bold; margin-top: 5px;}
    </style>
</head>
<body>

<div id="input-overlay">
    <div style="font-size: 12px; margin-bottom: 5px;">INPUT SIGNAL:</div>
    <input type="text" id="manual-in" style="background:#000; color:#00ff41; border:1px solid #d48841; padding:5px; width: 250px; outline: none;">
</div>

<div id="main-grid">
    <div id="workstation">
        <header style="text-align:center; margin-bottom:15px;">THE CLANK OF COPPER</header>
        <textarea id="editor" spellcheck="false">
Wire CPU A = "OP_ALPHA: "
Wire CPU B = "OP_BETA: "

Pulse 10 {
    Volt A
    Wire RAM msgA = Regulator
    Volt msgA

    Volt B
    Wire RAM msgB = Regulator
    Volt msgB
}</textarea>
        <button onclick="ignite()">IGNITE PULSE</button>
        <div id="console"></div>
    </div>
    <div id="hardware-rack" style="border: 2px solid #3e2723; padding: 10px; background: #050505;">
        <div style="text-align:center; font-size: 10px; color:#5d4037;">--- RAM STORAGE ---</div>
        <div id="rack-content"></div>
    </div>
</div>

<script>
    let hardware = { wires: {} };

    async function execute(cmd) {
        const con = document.getElementById('console');
        cmd = cmd.trim();
        if (!cmd) return;

        if (cmd.includes('= Regulator')) {
            const overlay = document.getElementById('input-overlay');
            const field = document.getElementById('manual-in');
            overlay.style.display = 'block';
            field.focus();
            
            let val = await new Promise(r => {
                field.onkeydown = (e) => {
                    if (e.key === 'Enter') {
                        overlay.style.display = 'none';
                        r(field.value);
                        field.value = '';
                    }
                };
            });
            let varName = cmd.split(' ')[2];
            hardware.wires[varName] = val;
            render();
        } 
        else if (cmd.startsWith('Wire ')) {
            let m = cmd.match(/Wire (\w+) (\w+) = "(.*)"/);
            if (m) hardware.wires[m[2]] = m[3];
            else {
                let mShort = cmd.match(/Wire (\w+) (\w+) = (\w+)/);
                if (mShort) hardware.wires[mShort[2]] = hardware.wires[mShort[3]] || mShort[3];
            }
        } 
        else if (cmd.startsWith('Volt ')) {
            let target = cmd.replace('Volt ', '').trim();
            let out = hardware.wires[target] !== undefined ? hardware.wires[target] : target;
            con.innerHTML += out.replace(/"/g, '') + "<br>";
            con.scrollTop = con.scrollHeight;
        }
    }

    async function ignite() {
        hardware.wires = {};
        document.getElementById('console').innerHTML = "";
        const rawCode = document.getElementById('editor').value;
        
        // Manual block parsing to handle Pulse properly
        if (rawCode.includes('Pulse')) {
            let lines = rawCode.split('\n');
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('Pulse')) {
                    let count = parseInt(line.match(/\d+/)[0]);
                    let loopLines = [];
                    i++; // move past {
                    while (i < lines.length && !lines[i].includes('}')) {
                        loopLines.push(lines[i].trim());
                        i++;
                    }
                    for (let c = 0; c < count; c++) {
                        for (let l of loopLines) await execute(l);
                    }
                } else {
                    await execute(line);
                }
            }
        }
    }

    function render() {
        const rack = document.getElementById('rack-content');
        rack.innerHTML = "";
        for (let w in hardware.wires) {
            rack.innerHTML += `<div style="font-size:11px; margin-bottom:5px; border-bottom:1px solid #222;">${w}: ${hardware.wires[w]}</div>`;
        }
    }
</script>
</body>
</html>
