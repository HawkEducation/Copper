<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>THE CLANK OF COPPER v4.0</title>
    <style>
        :root { --copper: #d48841; --brass: #a67c00; --bg: #1a120b; --power: #00ff41; --iron: #3e2723; }
        body { background: var(--bg); color: var(--copper); font-family: monospace; padding: 20px; margin: 0; display: flex; justify-content: center; }
        #main-grid { display: grid; grid-template-columns: 1fr 300px; gap: 20px; width: 95%; max-width: 1100px; margin-top: 20px; }
        
        /* The Workstation */
        #workstation { border: 3px solid var(--iron); padding: 20px; background: #000; box-shadow: 0 0 20px #000; }
        header { text-align: center; font-weight: bold; letter-spacing: 3px; font-size: 1.2rem; margin-bottom: 20px; border-bottom: 1px solid var(--iron); padding-bottom: 10px; }
        
        textarea { width: 100%; height: 220px; background: #0a0a0a; color: #ffab40; border: 1px solid var(--iron); padding: 12px; font-size: 14px; outline: none; resize: none; box-sizing: border-box; }
        
        /* The Output Console */
        #console { height: 250px; overflow-y: auto; background: #000; color: #a5d6a7; border: 1px inset var(--iron); margin-top: 15px; padding: 15px; line-height: 1.5; font-size: 13px; border-radius: 2px; }
        
        /* Controls */
        button { width: 100%; padding: 12px; background: var(--copper); color: #000; border: none; cursor: pointer; font-weight: bold; font-family: monospace; text-transform: uppercase; margin-top: 10px; transition: 0.2s; }
        button:hover { background: #ffab40; }
        button:disabled { background: #333; cursor: not-allowed; }

        /* The Input Hatch */
        #input-overlay { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #000; border: 2px solid var(--copper); padding: 30px; z-index: 1000; box-shadow: 0 0 100px #000; }
        #manual-in { background: #000; color: var(--power); border: 1px solid var(--copper); padding: 10px; width: 300px; outline: none; font-family: monospace; font-size: 16px; }

        /* Component Bay */
        #hardware-rack { border: 2px solid var(--iron); padding: 15px; background: #050505; height: 580px; overflow-y: auto; }
        .unit { border-left: 3px solid var(--copper); padding: 8px; margin-bottom: 10px; background: #111; font-size: 11px; }
    </style>
</head>
<body>

<div id="input-overlay">
    <div style="margin-bottom:10px; font-size: 12px; letter-spacing: 1px;">REGULATOR: INJECT SIGNAL</div>
    <input type="text" id="manual-in" autocomplete="off">
    <div style="margin-top: 10px; font-size: 9px; color: var(--brass);">PRESS ENTER TO COMMIT TO WIRE</div>
</div>

<div id="main-grid">
    <div id="workstation">
        <header>THE CLANK OF COPPER</header>
        <textarea id="editor" spellcheck="false">
Wire CPU A = "OP_ALPHA: "
Wire CPU B = "OP_BETA: "

Pulse 20 {
    Volt A
    Wire RAM msgA = Regulator
    Switch msgA == "EXIT" { Flow }
    Volt msgA

    Volt B
    Wire RAM msgB = Regulator
    Switch msgB == "EXIT" { Flow }
    Volt msgB
}</textarea>
        <button id="ignite-btn" onclick="ignite()">Ignite Pulse</button>
        <div id="console"></div>
    </div>

    <div id="hardware-rack">
        <div style="text-align:center; font-size: 10px; color:var(--brass); margin-bottom:15px; letter-spacing: 1px;">--- ASSET MONITOR ---</div>
        <div id="rack-content"></div>
    </div>
</div>

<script>
    let hardware = { wires: {} };

    async function execute(cmd) {
        const con = document.getElementById('console');
        cmd = cmd.trim();
        if (!cmd || cmd === "{" || cmd === "}") return;

        // 1. REGULATOR / WIRE LOGIC
        if (cmd.includes('= Regulator')) {
            const overlay = document.getElementById('input-overlay');
            const field = document.getElementById('manual-in');
            overlay.style.display = 'block';
            field.focus();
            
            let val = await new Promise(r => {
                field.onkeydown = (e) => {
                    if (e.key === 'Enter') {
                        overlay.style.display = 'none';
                        r(field.value);
                        field.value = '';
                    }
                };
            });
            let varName = cmd.split(' ')[2];
            hardware.wires[varName] = val;
            render();
        } 
        // 2. SWITCH (THE BRAKE)
        else if (cmd.startsWith('Switch')) {
            let m = cmd.match(/Switch (\w+) == "(.*)" \{ (.*) \}/);
            if (m) {
                let wireVal = hardware.wires[m[1]];
                let targetVal = m[2];
                let action = m[3];
                if (wireVal === targetVal) {
                    if (action === "Flow") {
                        con.innerHTML += `<div style="color:#ff5252; border-top:1px dashed #ff5252; margin-top:5px;">[MECHANICAL BRAKE ENGAGED: FLOW CLEARED]</div>`;
                        return "BREAK";
                    }
                }
            }
        }
        // 3. STATIC WIRE
        else if (cmd.startsWith('Wire ')) {
            let m = cmd.match(/Wire (\w+) (\w+) = "(.*)"/);
            if (m) hardware.wires[m[2]] = m[3];
            render();
        } 
        // 4. VOLT (OUTPUT)
        else if (cmd.startsWith('Volt ')) {
            let target = cmd.replace('Volt ', '').trim();
            let out = hardware.wires[target] !== undefined ? hardware.wires[target] : target;
            con.innerHTML += out.replace(/"/g, '') + "<br>";
            con.scrollTop = con.scrollHeight;
        }
        // 5. FLOW
        else if (cmd === 'Flow') {
            con.innerHTML += `<div style="color:var(--brass); font-size:10px;">--- PIPES CLEARED ---</div>`;
        }
    }

    async function ignite() {
        const btn = document.getElementById('ignite-btn');
        btn.disabled = true;
        hardware.wires = {};
        document.getElementById('console').innerHTML = "";
        
        const rawCode = document.getElementById('editor').value;
        let lines = rawCode.split('\n');

        for (let i = 0; i < lines.length; i++) {
            let line = lines[i].trim();
            if (!line) continue;

            if (line.startsWith('Pulse')) {
                let count = parseInt(line.match(/\d+/)[0]);
                let loopLines = [];
                i++; // Skip '{'
                while (i < lines.length && !lines[i].includes('}')) {
                    loopLines.push(lines[i].trim());
                    i++;
                }
                
                let broken = false;
                for (let c = 0; c < count; c++) {
                    for (let l of loopLines) {
                        let res = await execute(l);
                        if (res === "BREAK") { broken = true; break; }
                    }
                    if (broken) break;
                }
            } else {
                await execute(line);
            }
        }
        btn.disabled = false;
    }

    function render() {
        const rack = document.getElementById('rack-content');
        rack.innerHTML = "";
        for (let w in hardware.wires) {
            rack.innerHTML += `<div class="unit"><b>${w}</b><br>${hardware.wires[w]}</div>`;
        }
    }
</script>
</body>
</html>
