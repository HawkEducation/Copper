<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>COPPER & GEAR v2.9</title>
    <style>
        :root { --copper: #d48841; --brass: #a67c00; --bg: #1a120b; --power: #00ff41; }
        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 50%, #2c1e12 8%, transparent 8.5%);
            background-size: 80px 80px;
            color: var(--copper); font-family: 'Courier New', monospace;
            margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;
        }
        #main-grid { display: grid; grid-template-columns: 1fr 400px; gap: 20px; width: 95%; max-width: 1300px; }
        #workstation { border: 6px solid #3e2723; background: rgba(15, 10, 5, 0.95); padding: 20px; border-radius: 10px; }
        
        #hardware-rack {
            background: #050505; border: 4px solid #3e2723; padding: 20px;
            height: 650px; overflow-y: auto; box-shadow: inset 0 0 20px #000;
        }
        .rack-label { text-align: center; color: var(--brass); border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        
        .battery-unit { border: 2px solid #555; padding: 10px; margin-bottom: 20px; background: #111; border-radius: 4px; }
        .battery-header { font-size: 12px; margin-bottom: 8px; color: var(--brass); display: flex; justify-content: space-between; }
        .cell-container { display: flex; gap: 4px; height: 30px; }
        .cell { flex: 1; border: 1px solid #333; background: #000; }
        .cell.filled { background: var(--power); box-shadow: 0 0 10px var(--power); }
        
        .wire-unit { border-left: 3px solid var(--copper); padding: 5px 10px; margin-bottom: 10px; background: rgba(212, 136, 65, 0.05); font-size: 13px; }

        #gauge-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border: 2px solid #5d4037; padding: 10px; background: #000; }
        #pressure-bar { width: 60%; height: 20px; background: #222; border: 1px solid var(--copper); }
        #pressure-fill { width: 0%; height: 100%; background: linear-gradient(to right, #d48841, #ff5252); transition: width 0.5s; }

        textarea { width: 100%; height: 300px; background: #000; color: #ffab40; border: 1px solid #5d4037; padding: 15px; font-size: 14px; box-sizing: border-box; }
        #console { margin-top: 15px; height: 150px; overflow-y: auto; background: #000; border: 1px inset #5d4037; padding: 10px; color: #a5d6a7; font-size: 12px; }
        
        .controls { display: flex; gap: 10px; margin-top: 10px; }
        button { flex: 1; background: var(--copper); color: #1a120b; border: none; padding: 12px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="main-grid">
    <div id="workstation">
        <header style="text-align:center; margin-bottom:10px;">⚙️ COPPER & GEAR v2.9: AUDIO CHASSIS ⚡</header>
        <div id="gauge-container">
            <span>PSI GAUGE</span>
            <div id="pressure-bar"><div id="pressure-fill"></div></div>
            <span id="psi">0 PSI</span>
        </div>
        <textarea id="editor" spellcheck="false">
Gear triple();
Battery AA RAM iron = [1, 2, 3];

// Watch the rack and listen for the clink!
Conveyer iron THROUGH triple >> Battery AA RAM steel;

Wire CPU msg = "Forging Complete";
Volt msg;
Flow;</textarea>
        <div class="controls">
            <button onclick="ignite()">IGNITE PULSE</button>
            <button onclick="ventSteam()">FLOW</button>
        </div>
        <div id="console"></div>
    </div>

    <div id="hardware-rack">
        <div class="rack-label">--- COMPONENT BAY ---</div>
        <div id="rack-content"></div>
    </div>
</div>

<script>
    let hardware = { wires: {}, batteries: {}, pressure: 0, types: { 'AAA': 3, 'AA': 5, 'C': 10 } };
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // --- SOUND ENGINE ---
    function playSound(type) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'clank') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        } else if (type === 'hiss') {
            const bufferSize = audioCtx.sampleRate * 0.5;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            noise.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            noise.start();
        } else if (type === 'clink') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        }
    }

    // --- LOGIC ---
    function renderHardware() {
        const rack = document.getElementById('rack-content');
        rack.innerHTML = "";
        for (let name in hardware.batteries) {
            let b = hardware.batteries[name];
            let cellsHTML = "";
            for(let i=0; i < b.capacity; i++) cellsHTML += `<div class="cell ${i < b.data.length ? 'filled' : ''}"></div>`;
            rack.innerHTML += `<div class="battery-unit"><div class="battery-header"><span>[${b.size}] ${name}</span></div><div class="cell-container">${cellsHTML}</div></div>`;
        }
        for (let name in hardware.wires) {
            rack.innerHTML += `<div class="wire-unit"><b>WIRE:</b> ${name}</div>`;
        }
    }

    function updatePressure(amt) {
        hardware.pressure = Math.max(0, Math.min(hardware.pressure + amt, 100));
        document.getElementById('pressure-fill').style.width = hardware.pressure + "%";
        document.getElementById('psi').innerText = hardware.pressure + " PSI";
    }

    function ventSteam() { 
        playSound('hiss'); 
        hardware.pressure = 0; updatePressure(0); 
    }

    async function ignite() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        hardware.wires = {}; hardware.batteries = {};
        const lines = document.getElementById('editor').value.split(';');
        
        for (let line of lines) {
            let cmd = line.trim();
            if (!cmd) continue;

            if (cmd.startsWith('Battery ')) {
                let m = cmd.match(/Battery (\w+) (\w+) (\w+) = \[(.*)\]/);
                hardware.batteries[m[3]] = { size: m[1], data: m[4].split(','), capacity: hardware.types[m[1]] };
                playSound('clank');
                updatePressure(10);
            } else if (cmd.startsWith('Conveyer ')) {
                let m = cmd.match(/Conveyer (\w+) THROUGH (\w+) >> Battery (\w+) (\w+) (\w+)/);
                let input = hardware.batteries[m[1]].data;
                for(let i=0; i<input.length; i++) {
                    await new Promise(r => setTimeout(r, 100));
                    playSound('clink');
                }
                hardware.batteries[m[5]] = { size: m[3], data: input.map(x => x*3), capacity: hardware.types[m[3]] };
                updatePressure(20);
            } else if (cmd.startsWith('Flow')) {
                ventSteam();
            }
            renderHardware();
            await new Promise(r => setTimeout(r, 150));
        }
    }
</script>
</body>
</html>
