<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>COPPER & GEAR v2.0</title>
    <style>
        body {
            background-color: #1a120b;
            background-image: 
                radial-gradient(circle at 50% 50%, #2c1e12 8%, transparent 8.5%),
                linear-gradient(to right, #24190e 1px, transparent 1px),
                linear-gradient(to bottom, #24190e 1px, transparent 1px);
            background-size: 100px 100px, 20px 20px, 20px 20px;
            color: #d48841; font-family: 'Courier New', monospace;
            display: flex; flex-direction: column; align-items: center; padding: 20px;
        }

        #workstation {
            width: 90%; max-width: 1000px;
            border: 8px solid #3e2723; background: rgba(15, 10, 5, 0.95);
            padding: 30px; border-radius: 10px; box-shadow: 0 0 30px #000;
        }

        #gauge-container {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; border: 2px solid #5d4037; padding: 10px; background: #0a0a0a;
        }

        #pressure-bar { width: 70%; height: 20px; background: #222; border: 1px solid #d48841; }
        #pressure-fill { width: 0%; height: 100%; background: linear-gradient(to right, #d48841, #ff5252); transition: width 0.5s; }

        textarea {
            width: 100%; height: 300px; background: #050505; color: #ffab40;
            border: 2px solid #5d4037; padding: 15px; font-size: 16px; box-sizing: border-box;
        }

        #console {
            margin-top: 20px; height: 200px; overflow-y: auto;
            background: #000; border: 2px inset #5d4037; padding: 15px;
            color: #a5d6a7; font-size: 14px; transition: filter 0.3s;
        }

        .controls { display: flex; gap: 10px; margin-top: 15px; }
        button { flex: 1; background: #d48841; color: #1a120b; border: none; padding: 12px; cursor: pointer; font-weight: bold; }
        button:hover { background: #ffab40; }
    </style>
</head>
<body>

<div id="workstation">
    <header style="text-align:center; margin-bottom:10px;">⚙️ COPPER & GEAR v2.0 ⚡</header>
    
    <div id="gauge-container">
        <span>STEAM PRESSURE</span>
        <div id="pressure-bar"><div id="pressure-fill"></div></div>
        <span id="psi">0 PSI</span>
    </div>

    <textarea id="editor" spellcheck="false">
Gear combine();

Wire RAM alpha = 200;
Wire RAM beta = 300;

// Engaging the gear for fused power
Wire RAM fused = combine(alpha, beta);

Volt "Total Output:";
Volt fused;

// Charging a heavy battery
Battery AA RAM cells = [10, 20, 30, 40, 50];
Volt cells;</textarea>

    <div class="controls">
        <button onclick="ignite()">IGNITE PULSE</button>
        <button onclick="ventSteam()">VENT STEAM</button>
    </div>

    <div id="console"></div>
</div>

<script>
    let hardware = { 
        wires: {}, gears: {}, batteries: {}, pressure: 0,
        types: { 'Coin': 1, 'AAA': 3, 'AA': 5, 'C': 10, 'D': 20, '9V': 50 }
    };

    function log(msg, type = "info") {
        const con = document.getElementById('console');
        let color = type === "error" ? "#ff5252" : (type === "system" ? "#ffab40" : "#a5d6a7");
        con.innerHTML += `<span>[${new Date().toLocaleTimeString()}] ${msg}</span><br>`;
        con.scrollTop = con.scrollHeight;
        con.style.filter = `blur(${hardware.pressure / 25}px)`;
    }

    function updatePressure(amt) {
        hardware.pressure = Math.min(hardware.pressure + amt, 100);
        document.getElementById('pressure-fill').style.width = hardware.pressure + "%";
        document.getElementById('psi').innerText = hardware.pressure + " PSI";
        if(hardware.pressure >= 85) log("⚠️ CRITICAL PRESSURE: VENT STEAM", "error");
    }

    function ventSteam() {
        hardware.pressure = 0;
        updatePressure(0);
        log("💨 Steam vented. System clear.", "system");
    }

    function ignite() {
        const code = document.getElementById('editor').value;
        const lines = code.split(';');
        
        lines.forEach(line => {
            let cmd = line.trim();
            if (!cmd || cmd.startsWith("//")) return;

            try {
                // GEAR REGISTRATION
                if (cmd.startsWith('Gear ')) {
                    let nameMatch = cmd.match(/Gear (\w+)/);
                    if(nameMatch) {
                        hardware.gears[nameMatch[1]] = true;
                        log(`⚙️ Gear '${nameMatch[1]}' mounted.`, "system");
                    }
                }
                // BATTERY DEFINITION
                else if (cmd.startsWith('Battery ')) {
                    let match = cmd.match(/Battery (\w+) (RAM|ROM|CPU) (\w+) = \[(.*)\]/);
                    if (match) {
                        let [_, size, type, name, vals] = match;
                        let data = vals.split(',').map(v => v.trim());
                        if (data.length > hardware.types[size]) throw `Overcharge! Max ${hardware.types[size]} for ${size}`;
                        hardware.batteries[name] = { data: data, type: type };
                        updatePressure(10);
                        log(`🔋 ${size} Battery '${name}' charged.`, "system");
                    }
                }
                // WIRE & GEAR CALLS
                else if (cmd.startsWith('Wire ')) {
                    let match = cmd.match(/Wire (RAM|ROM|CPU) (\w+) = (.*)/);
                    if (match) {
                        let [_, type, name, expr] = match;
                        let val;

                        if (expr.includes('(')) {
                            let gName = expr.split('(')[0].trim();
                            let paramsMatch = expr.match(/\((.*)\)/);
                            let params = paramsMatch[1].split(',').map(p => {
                                let pName = p.trim();
                                return hardware.wires[pName] !== undefined ? hardware.wires[pName] : Number(pName);
                            });

                            if (gName === 'combine') val = params.reduce((a, b) => a + b, 0);
                            updatePressure(15);
                            log(`⚙️ Gear '${gName}' spinning...`, "system");
                        } else {
                            // Direct Assignment
                            let cleanExpr = expr.trim();
                            if (hardware.wires[cleanExpr] !== undefined) {
                                val = hardware.wires[cleanExpr];
                            } else {
                                val = type === "CPU" ? cleanExpr.replace(/"/g, '') : eval(cleanExpr);
                            }
                        }

                        if (type === "RAM" && isNaN(parseInt(val))) throw `Short Circuit! RAM requires numeric current.`;
                        hardware.wires[name] = val;
                        log(`⚡ Wire '${name}' energized.`, "system");
                    }
                }
                // VOLT (The Output)
                else if (cmd.startsWith('Volt ')) {
                    let target = cmd.replace('Volt ', '').trim();
                    let finalOut;

                    if (hardware.wires[target] !== undefined) {
                        finalOut = hardware.wires[target];
                    } else if (hardware.batteries[target]) {
                        finalOut = `[${hardware.batteries[target].data.join(' | ')}]`;
                    } else {
                        finalOut = target.replace(/"/g, '');
                    }
                    log(`VOLTAGE: ${finalOut}`);
                }
            } catch (e) {
                log(`💥 ERROR: ${e}`, "error");
            }
        });
    }
</script>
</body>
</html>
